<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Shani GPT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="{{ url_for('login') }}">
          <div class="logo-text"><span>Shani</span> GPT</div>
        </a>
        <p>Sign in to continue</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="auth-flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}" novalidate>
        <div class="auth-form-group">
          <label for="email">Email</label>
          <div class="auth-input-wrapper">
            <span class="input-icon">✉</span>
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input"
              placeholder="Enter your email"
              required
              autocomplete="email"
              autofocus
            />
          </div>
        </div>

        <div class="auth-form-group">
          <label for="password">Password</label>
          <div class="auth-input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input"
              placeholder="Enter password"
              required
              autocomplete="current-password"
            />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <a href="#" class="auth-forgot">Forgot password?</a>

        <button type="submit" class="auth-submit">Sign In</button>
      </form>

      <div class="auth-links">
        <p>Don't have an account?</p>
        <a href="{{ url_for('register') }}">Create account</a>
      </div>
    </div>
  </div>

  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('password-toggle');
    const passwordInput = document.getElementById('password');
    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁' : '👁‍🗨';
      });
    }
  </script>
</body>
</html>
