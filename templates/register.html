<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Shani GPT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="{{ url_for('login') }}">
          <div class="logo-text"><span>Shani</span> GPT</div>
        </a>
        <p>Create your account</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="auth-flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('register') }}" novalidate>
        <div class="auth-form-group">
          <label for="name">Full Name</label>
          <div class="auth-input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="name"
              name="name"
              class="auth-input"
              placeholder="John Doe"
              required
              autocomplete="name"
              autofocus
            />
          </div>
        </div>

        <div class="auth-form-group">
          <label for="email">Email</label>
          <div class="auth-input-wrapper">
            <span class="input-icon">✉</span>
            <input
              type="email"
              id="email"
              name="email"
              class="auth-input"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="auth-form-group">
          <label for="password">Password</label>
          <div class="auth-input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="auth-input"
              placeholder="Create a strong password"
              required
              autocomplete="new-password"
              minlength="6"
            />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <div class="auth-form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="auth-input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              class="auth-input"
              placeholder="Confirm your password"
              required
              autocomplete="new-password"
              minlength="6"
            />
          </div>
        </div>

        <button type="submit" class="auth-submit">Create Account</button>
      </form>

      <div class="auth-links">
        <p>Already have an account?</p>
        <a href="{{ url_for('login') }}">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('password-toggle');
    const passwordInput = document.getElementById('password');
    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁' : '👁‍🗨';
      });
    }

    // Client-side password match validation
    const form = document.querySelector('form');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');

    form.addEventListener('submit', function(e) {
      if (password.value !== confirmPassword.value) {
        e.preventDefault();
        confirmPassword.classList.add('error');
        alert('Passwords do not match. Please try again.');
      } else {
        confirmPassword.classList.remove('error');
      }
    });

    confirmPassword.addEventListener('input', function() {
      if (this.value === password.value) {
        this.classList.remove('error');
      }
    });
  </script>
</body>
</html>
